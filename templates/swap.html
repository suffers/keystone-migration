{% extends "base.html" %}
{% block title %}Swap — Nexus{% endblock %}
{% block content %}
<section class="page page-narrow">
  <div class="topbar">
    <a class="icon-btn" href="{{ url_for('home') }}" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Swap</h1>
  </div>

  <div class="panel">
    <form method="post" action="{{ url_for('swap') }}">
      <div class="swap-card">
        <div class="muted small" style="margin-bottom:8px">You sell</div>
        <div class="row">
          <input name="amount" value="0.023" inputmode="decimal" />
          <select name="sell" style="border:0;background:var(--bg-elevated);border-radius:999px;padding:8px 12px;font-weight:700">
            {% for n in networks %}
            <option value="{{ n.symbol }}" {% if n.symbol == 'ETH' %}selected{% endif %}>{{ n.symbol }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="swap-toggle" aria-hidden="true">↓</div>

      <div class="swap-card">
        <div class="muted small" style="margin-bottom:8px">You buy</div>
        <div class="row">
          <div style="font-size:28px;font-weight:700">23.41</div>
          <select name="buy" style="border:0;background:var(--bg-elevated);border-radius:999px;padding:8px 12px;font-weight:700">
            {% for n in networks %}
            <option value="{{ n.symbol }}" {% if n.symbol == 'BTC' %}selected{% endif %}>{{ n.symbol }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <p class="muted small">One-tap swaps · signed on your selected Keystone</p>
      <button class="primary-btn full mt-24" type="submit">Next — sign with Keystone</button>
      <p class="footer-note">Signed on your Keystone · network fees apply</p>
    </form>
  </div>
</section>
{% endblock %}
